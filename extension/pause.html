<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Respiro · pausa</title>
<link rel="stylesheet" href="style.css">
<style>
  main { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .breath { width: 190px; height: 190px; margin: 36px auto 0; position: relative; transition: all .4s; }
  .breath i { position: absolute; inset: 0; margin: auto; border-radius: 50%; border: 3px solid var(--fg); width: 40%; height: 40%;
    animation: breathe 8s ease-in-out infinite; }
  .breath.small { width: 100px; height: 100px; margin-top: 24px; }
  @keyframes breathe { 0%, 100% { width: 40%; height: 40%; } 50% { width: 100%; height: 100%; } }
  #phase { font-size: 17px; font-weight: 500; color: var(--mu); margin-top: 14px; }
  #count { color: var(--mu); font-size: 14px; margin-top: 2px; }
  #phrase { margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="name" class="c"></h1>
  <p id="sub" class="mu c"></p>
  <div id="breathBox">
    <div class="breath" id="breath"><i></i></div>
    <p id="phase" class="c">inspire</p>
    <p id="count" class="c"></p>
  </div>
  <div id="choices" class="hidden"></div>
</main>
<script src="common.js"></script>
<script src="pause.js"></script>
</body>
</html>
